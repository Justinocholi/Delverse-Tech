# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
tone_instructions: "Be precise, constructive, and prioritize enterprise performance, WCAG AA accessibility, TypeScript safety, and zero regressions."
early_access: false
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
  tools:
    ast-grep:
      enabled: true
    shellcheck:
      enabled: true
chat:
  auto_reply: true
